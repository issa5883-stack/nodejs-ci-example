name: Node.js CI

on:
  push:
    branches: [ main ]

  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
  deploy-to-staging:
  needs: build-and-test
  runs-on: ubuntu-latest
  environment: Staging

  steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Simulate deployment to Staging
      run: |
        echo "Deploying application to Staging environment..."
        echo "Application version: $(git rev-parse --short HEAD)"
        echo "Deployment to Staging successful!"